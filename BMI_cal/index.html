<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
    <div id="main">
    <h1>BMI Calculator</h1>
    <form action="" id="form">
        <label for="height">Height</label>
        <input id="height" type="number" placeholder="In CM">

        <label for="weight">Weight</label>
        <input id="weight" type="number" placeholder="In Kg">

        <button id="button">Calculate</button>
    </form>

    <div class="result">
        <h4>Your BMI Score</h4>
        <h2 id="score">50.22</h2> 
    </div>
    <div class="info">
        <h4>BMI weight Guide</h4>
        <p>• Underweight: Less than 18.5</p>
        <p>• Healthy Weight: 18.5 to 24.9</p>
        <p>• Overweight: 25.0 to 29.9</p>
        <p>• Obesity (Class I): 30.0 to 34.9</p>
        <p>• Obesity (Class II): 35.0 to 39.9</p>
        <p>• Obesity (Class III): 40.0 or higher</p>
    </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
